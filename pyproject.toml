[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "export-inspector"
version = "0.1.0"
description = "Desktop and CLI tools for inspecting personal data exports."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
  "PySide6>=6.8",
]

[project.scripts]
export-inspector = "export_inspector.gui:main"
messenger-chat = "export_inspector.messenger_chat:main"
google-mail = "export_inspector.google_mail:main"
untappd-export = "export_inspector.untappd:main"
runkeeper-export = "export_inspector.runkeeper:main"

[tool.setuptools.packages.find]
include = ["export_inspector*"]
