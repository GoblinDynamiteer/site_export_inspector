[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "export-inspector"
version = "0.1.0"
description = "Desktop and CLI tools for inspecting personal data exports."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
  "PySide6>=6.8",
]

[project.scripts]
export-inspector = "export_inspector.gui:main"
messenger-chat = "show_messenger_chat:main"
google-mail = "google_mail:main"
untappd-export = "untappd:main"
runkeeper-export = "runkeeper:main"

[tool.setuptools]
py-modules = [
  "google_mail",
  "runkeeper",
  "show_messenger_chat",
  "untappd",
]

[tool.setuptools.packages.find]
include = ["export_inspector*"]
